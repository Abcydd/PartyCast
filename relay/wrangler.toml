name = "partycast-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY_STATE"
class_name = "RelayState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayState"]

[vars]
MONTHLY_CAP_GB = "900"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "CODE_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 30
period = 60
